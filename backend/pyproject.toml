[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.66.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "google-genai>=1.57.0",
    "matplotlib>=3.10.8",
    "python-multipart>=0.0.21",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "uvicorn>=0.40.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 120
